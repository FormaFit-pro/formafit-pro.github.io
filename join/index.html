<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación · Forma Fit</title>
<meta name="description" content="Tu entrenador te invita a Forma Fit.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:ital,wght@0,500;0,700;0,800;0,900;1,900&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
  .code {
    font: italic 800 44px/1 "Barlow Condensed", sans-serif;
    letter-spacing: .04em;
    color: var(--accent);
    margin: 8px 0 16px;
    user-select: all;
  }
  .hint { font-size: 14px; color: var(--muted); margin: 12px 0 0; }
</style>
</head>
<body class="accent">
<header class="cut">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Forma Fit"><b>Forma</b><svg viewBox="0 0 378 126" aria-hidden="true"><path d="M184.827 126H163.739C162.466 126 161.512 124.836 161.762 123.589L186.155 1.62099C186.344 0.678667 187.171 0.000366211 188.132 0.000366211H209.22C210.492 0.000366211 211.447 1.16425 211.197 2.41173L186.804 124.379C186.615 125.322 185.788 126 184.827 126Z"/><path d="M375.097 0C376.369 0 377.323 1.16388 377.074 2.41136L372.84 23.5796C372.652 24.5219 371.824 25.2002 370.863 25.2002H318.729C317.768 25.2002 316.941 25.8785 316.752 26.8208L297.24 124.379C297.052 125.322 296.225 126 295.264 126H274.175C272.903 126 271.949 124.836 272.198 123.589L291.394 27.6116C291.644 26.3641 290.689 25.2002 289.417 25.2002H243.936C242.664 25.2002 241.71 24.0363 241.959 22.7888L246.193 1.62062C246.381 0.678299 247.209 0 248.17 0H375.097Z"/><path d="M23.5472 126H2.45912C1.18693 126 0.232776 124.836 0.482272 123.589L20.338 24.3097C23.165 10.1749 35.5759 0.000366211 49.9907 0.000366211H138.66C139.933 0.000366211 140.887 1.16425 140.637 2.41173L136.404 23.5797C136.215 24.522 135.388 25.2003 134.427 25.2003H53.8989C48.9714 25.2003 44.7661 28.7627 43.956 33.6231L40.7111 53.0928C40.5063 54.3216 41.4539 55.4402 42.6997 55.4402H98.2176C99.5292 55.4402 100.492 56.6727 100.173 57.9451L96.1414 74.0731C95.9171 74.9705 95.1107 75.6001 94.1856 75.6001H36.9326C35.9716 75.6001 35.1442 76.2784 34.9558 77.2207L25.524 124.379C25.3356 125.322 24.5082 126 23.5472 126Z"/></svg></a>
    <h1 data-t="h1">Tu entrenador te invita</h1>
    <p class="tagline" data-t="tag">Recibe tu programa y registra tus entrenos</p>
  </div>
</header>
<main>
  <div class="wrap stack">
    <!-- Con código: abrir la app y el código para pegarlo. Sin él, solo las stores. -->
    <section class="card" id="withCode" hidden>
      <p class="caps" data-t="yourCode">Tu código</p>
      <p class="code" id="code"></p>
      <div class="stack">
        <a class="btn" id="open" href="#" data-t="open">Abrir en Forma Fit</a>
        <button class="btn dark" id="copy" type="button" data-t="copy">Copiar código</button>
      </div>
      <p class="hint" data-t="hint">¿Acabas de instalar la app? Pega este código cuando te pida el de tu entrenador.</p>
    </section>

    <section>
      <h2 data-t="noApp">¿Aún no tienes la app?</h2>
      <div class="stack">
        <a class="btn dark" id="play" href="https://play.google.com/store/apps/details?id=com.formastudio.formafit">Google Play</a>
        <a class="btn dark" id="ios" aria-disabled="true" data-t="iosSoon">App Store · próximamente</a>
      </div>
    </section>
  </div>
</main>
<footer>
  <div class="wrap">
    <a href="/privacidad/" data-t="priv">Privacidad</a>
    <span>© 2026 Forma Fit</span>
  </div>
</footer>
<script>
  const PACKAGE = 'com.formastudio.formafit';
  const PLAY = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
  const APP_STORE = null; // la ficha de iOS cuando exista

  const EN = {
    h1: 'Your coach invited you',
    tag: 'Get your program and log your workouts',
    yourCode: 'Your code',
    open: 'Open in Forma Fit',
    copy: 'Copy code',
    copied: 'Copied',
    hint: 'Just installed the app? Paste this code when it asks for your coach’s.',
    noApp: 'Don’t have the app yet?',
    iosSoon: 'App Store · coming soon',
    priv: 'Privacy',
  };
  const en = !navigator.language.toLowerCase().startsWith('es');
  if (en) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = EN[el.dataset.t]; });
    document.querySelector('[data-t="priv"]').href = '/privacy/';
  }

  const ua = navigator.userAgent;
  const android = /Android/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  // La store del visitante primero.
  const ios$ = document.getElementById('ios');
  if (APP_STORE) { ios$.href = APP_STORE; ios$.textContent = 'App Store'; ios$.removeAttribute('aria-disabled'); }
  if (ios) ios$.parentNode.prepend(ios$);

  // Código con el formato de la app: XXXX-XXXX (supabaseSync.js, generateClientCode).
  const raw = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  const code = /^[A-Z0-9]{4}-?[A-Z0-9]{4}$/.test(raw) ? raw.replace(/^(.{4})-?/, '$1-') : null;

  if (code) {
    document.getElementById('withCode').hidden = false;
    document.getElementById('code').textContent = code;

    // Un toque, no redirección sola: los navegadores internos (WhatsApp,
    // Instagram) bloquean abrir forma:// sin gesto del usuario (M02 §4).
    const open = document.getElementById('open');
    if (android) {
      open.href = 'intent://join/' + code + '#Intent;scheme=forma;package=' + PACKAGE
        + ';S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
    } else if (ios) {
      open.href = 'forma://join/' + code;
    } else {
      open.hidden = true; // en el ordenador no hay app que abrir
    }

    const copy = document.getElementById('copy');
    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(code);
        copy.textContent = en ? EN.copied : 'Copiado';
      } catch {
        getSelection().selectAllChildren(document.getElementById('code'));
      }
    });
  }
</script>
</body>
</html>
